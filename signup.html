<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إنشاء حساب — صحّتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4AF37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="صحّتي">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   صحّتي — نظام التصميم الأساسي (ثيم أسود ذهبي فاخر)
   ========================================================================== */

:root {
  --bg: #0C0B0A;
  --surface: #1B1815;
  --surface-2: #262019;

  --text: #F3ECDD;
  --text-soft: #A8987C;

  --primary: #D4AF37;
  --primary-dark: #B8952C;
  --on-primary: #14120E;

  --accent: #E0A63A;
  --danger: #E4574C;
  --line: #2E2820;

  --shadow: 0 14px 34px rgba(0, 0, 0, 0.55);

  --gap-xs: 6px;
  --gap-sm: 12px;
  --gap-md: 20px;
  --gap-lg: 32px;
  --gap-xl: 48px;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --font-display: 'Cairo', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;
}

* { box-sizing: border-box; }
html { direction: rtl; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 76px;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text);
  margin: 0 0 var(--gap-sm) 0;
  line-height: 1.3;
}
h1 { font-size: 28px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }

p { margin: 0 0 var(--gap-sm) 0; color: var(--text-soft); }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

.screen {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
}
.container { padding: var(--gap-md); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: var(--gap-sm);
  width: 100%; padding: 15px var(--gap-md);
  border-radius: var(--radius-md); border: none;
  font-weight: 700; font-size: 16px; cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn-outline:hover { border-color: var(--primary); }
.btn-ghost { background: transparent; color: var(--text-soft); padding: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.pill-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 20px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--text);
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.pill-btn.filled { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pill-btn.surface { background: var(--surface); border-color: var(--line); }

.field { margin-bottom: var(--gap-md); }
.field label { display: block; font-size: 14px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.field input, .field select {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color 0.15s ease;
}
.field input::placeholder { color: var(--text-soft); opacity: 0.7; }
.field input:focus, .field select:focus { border-color: var(--primary); }

.hint { font-size: 13px; color: var(--text-soft); opacity: 0.9; margin-top: 4px; }
.error-text { font-size: 13px; color: var(--danger); margin-top: 4px; display: none; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; }
.badge-success { background: rgba(212,175,55,0.14); color: var(--primary); }
.badge-warn { background: rgba(224,166,58,0.16); color: var(--accent); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--gap-md); background: var(--bg); border-bottom: 1px solid var(--line); color: var(--text);
}
.topbar h1 { color: var(--text); font-size: 20px; margin: 0; }

.divider { display: flex; align-items: center; gap: var(--gap-sm); color: var(--text-soft); font-size: 13px; margin: var(--gap-md) 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.bio-option {
  display: flex; align-items: center; gap: var(--gap-sm);
  padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius-md);
  margin-bottom: var(--gap-sm); cursor: pointer; background: var(--surface);
  transition: border-color 0.15s ease, background 0.15s ease;
}
.bio-option.selected { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .icon {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.bio-option .icon svg { width: 22px; height: 22px; stroke: var(--text); }
.bio-option .texts { flex: 1; }
.bio-option .texts strong { display: block; font-size: 15px; color: var(--text); }
.bio-option .texts span { font-size: 13px; color: var(--text-soft); }
.bio-option.linked { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.bio-option.linked .check { background: var(--primary); border-color: var(--primary); }
.bio-option .check svg { width: 13px; height: 13px; stroke: var(--on-primary); display: none; }
.bio-option.linked .check svg { display: block; }

.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: var(--surface-2); color: var(--text); padding: 12px 22px;
  border-radius: var(--radius-md); font-size: 14px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease, bottom 0.25s ease;
  z-index: 200; max-width: 90%; text-align: center; border: 1px solid var(--line);
}
.toast.show { opacity: 1; bottom: 100px; }
.toast.error { background: var(--danger); color: #fff; border-color: transparent; }
.toast.success { background: var(--primary); color: var(--on-primary); border-color: transparent; }

.spinner {
  width: 20px; height: 20px; border: 2.5px solid rgba(212,175,55,0.25);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- الهيدر الزخرفي: شعار الرياضي المتحرك ---------------- */

.athlete-hero {
  position: relative;
  height: 176px;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 50% 0%, rgba(212,175,55,0.16) 0%, transparent 60%),
    linear-gradient(180deg, #14120E 0%, #0C0B0A 100%);
  border-radius: 0 0 28px 28px;
  border-bottom: 1px solid var(--line);
}
.athlete-hero .hero-content {
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 2px;
}
.athlete-hero .hero-content h1 { color: var(--primary); margin-bottom: 0; letter-spacing: 0.5px; }
.athlete-hero .hero-content p { margin: 0; font-size: 13px; color: var(--text-soft); }

.athlete-hero .glow-line {
  position: absolute; bottom: 34%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.55), transparent);
  animation: glow-run 1.6s linear infinite;
  z-index: 1;
}
.athlete-hero .glow-line.g1 { left: 0; width: 40%; animation-delay: 0s; }
.athlete-hero .glow-line.g2 { left: 0; width: 25%; top: 58%; animation-delay: 0.5s; }
@keyframes glow-run {
  0% { transform: translateX(-40%); opacity: 0; }
  20% { opacity: 0.9; }
  80% { opacity: 0.9; }
  100% { transform: translateX(320%); opacity: 0; }
}

.athlete-figure { width: 86px; height: 100px; z-index: 2; position: relative; }

@media (prefers-reduced-motion: reduce) {
  .athlete-hero .glow-line { animation: none !important; display: none; }
}

.bottom-nav {
  position: fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto;
  background: var(--surface); border-top: 1px solid var(--line);
  display:flex; justify-content:space-around; padding: 10px 0 14px;
}
.bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text-soft); font-weight:600; }
.bottom-nav a.active { color: var(--primary); }
.bottom-nav svg { width:22px; height:22px; }
</style>
</head>
<body>
<div class="screen">

  <div class="athlete-hero" style="height:110px; border-radius:0 0 22px 22px;">
    <div class="glow-line g1"></div>
    <div class="hero-content">
      <a href="login.html" style="position:absolute; top:14px; right:16px; font-size:13px; color:var(--text-soft); z-index:4;">→ رجوع</a>
      <h1 style="font-size:20px; color:var(--primary);">حساب جديد</h1>
    </div>
  </div>

  <div class="container">

    <div id="step-info">
      <h2>بياناتك</h2>
      <p>عبّي بياناتك عشان ننشئ حسابك في صحّتي.</p>

      <div class="field">
        <label for="name">الاسم الكامل</label>
        <input id="name" type="text" placeholder="مثال: سارة علي" autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">رقم التواصل</label>
        <input id="phone" type="tel" placeholder="05xxxxxxxx" autocomplete="tel">
      </div>
      <div class="field">
        <label for="password">كلمة السر</label>
        <input id="password" type="password" placeholder="8 أحرف على الأقل" autocomplete="new-password">
        <div class="error-text" id="info-error"></div>
      </div>

      <button class="btn btn-primary" id="btn-next">التالي</button>
    </div>

    <div id="step-bio" style="display:none;">
      <h2>اربط بصمتك</h2>
      <p>تقدر تربط بصمة الوجه وبصمة اليد معًا بنفس الحساب — استخدم أي منهما لاحقًا لتسجيل الدخول. هذي الخطوة اختيارية بالكامل، وممكن تدخل بكلمة السر فقط.</p>

      <div class="bio-option" data-type="face" id="opt-face">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10h.01M15 10h.01M8 15c1 1.2 2.4 2 4 2s3-.8 4-2"/><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/></svg>
        </div>
        <div class="texts">
          <strong>بصمة الوجه (Face ID)</strong>
          <span id="face-status">غير مرتبطة</span>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      </div>

      <div class="bio-option" data-type="hand" id="opt-hand">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4M12 10V4.5a1.5 1.5 0 0 1 3 0V10M15 10V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7s-5.5-2-6.5-4L4 13a1.4 1.4 0 0 1 2.3-1.6L8 13.5"/></svg>
        </div>
        <div class="texts">
          <strong>بصمة اليد (Fingerprint)</strong>
          <span id="hand-status">غير مرتبطة</span>
        </div>
        <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      </div>

      <div id="bio-note" class="hint" style="display:none;"></div>
      <div class="error-text" id="bio-error"></div>

      <button class="btn btn-primary" id="btn-finish" style="margin-top:8px;">إنهاء وفتح صحّتي</button>
      <button class="btn btn-ghost" id="btn-skip" style="margin-top:4px;">المتابعة بكلمة السر فقط</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.athlete-figure').forEach(svg => { if (svg.pauseAnimations) svg.pauseAnimations(); });
  }
</script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  const stepInfo = document.getElementById('step-info');
  const stepBio = document.getElementById('step-bio');
  const infoError = document.getElementById('info-error');
  const bioError = document.getElementById('bio-error');
  const toast = document.getElementById('toast');
  let createdUser = null;

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  document.getElementById('btn-next').addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;

    if (!name || !phone || password.length < 8) {
      infoError.textContent = 'تأكد من تعبئة كل الحقول وأن كلمة السر 8 أحرف على الأقل';
      infoError.style.display = 'block';
      return;
    }
    if (Auth.findUserByPhone(phone)) {
      infoError.textContent = 'رقم التواصل مسجّل مسبقًا';
      infoError.style.display = 'block';
      return;
    }
    infoError.style.display = 'none';

    createdUser = await Auth.createUser({ name, phone, password });
    Auth.setSession(createdUser.id);

    stepInfo.style.display = 'none';
    stepBio.style.display = 'block';

    if (!Auth.isWebAuthnSupported()) {
      document.getElementById('opt-face').style.pointerEvents = 'none';
      document.getElementById('opt-hand').style.pointerEvents = 'none';
      document.getElementById('opt-face').style.opacity = '0.45';
      document.getElementById('opt-hand').style.opacity = '0.45';
      const note = document.getElementById('bio-note');
      note.textContent = 'جهازك لا يدعم التحقق البيومتري حاليًا — استمر بكلمة السر.';
      note.style.display = 'block';
    }
  });

  async function linkBiometric(type) {
    bioError.style.display = 'none';
    try {
      await Auth.registerBiometric(createdUser.id, type);
      document.getElementById(`opt-${type}`).classList.add('linked');
      document.getElementById(`${type}-status`).textContent = 'مرتبطة ✓';
      showToast('تم الربط بنجاح', 'success');
    } catch (err) {
      bioError.textContent = err.message;
      bioError.style.display = 'block';
    }
  }

  document.getElementById('opt-face').addEventListener('click', function () {
    if (!this.classList.contains('linked')) linkBiometric('face');
  });
  document.getElementById('opt-hand').addEventListener('click', function () {
    if (!this.classList.contains('linked')) linkBiometric('hand');
  });

  document.getElementById('btn-finish').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
  document.getElementById('btn-skip').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
