<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تقدّمي — صحّتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4AF37">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   صحّتي — نظام التصميم الأساسي (ثيم أسود ذهبي فاخر)
   ========================================================================== */

:root {
  --bg: #0C0B0A;
  --surface: #1B1815;
  --surface-2: #262019;

  --text: #F3ECDD;
  --text-soft: #A8987C;

  --primary: #D4AF37;
  --primary-dark: #B8952C;
  --on-primary: #14120E;

  --accent: #E0A63A;
  --danger: #E4574C;
  --line: #2E2820;

  --shadow: 0 14px 34px rgba(0, 0, 0, 0.55);

  --gap-xs: 6px;
  --gap-sm: 12px;
  --gap-md: 20px;
  --gap-lg: 32px;
  --gap-xl: 48px;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --font-display: 'Cairo', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;
}

* { box-sizing: border-box; }
html { direction: rtl; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 76px;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text);
  margin: 0 0 var(--gap-sm) 0;
  line-height: 1.3;
}
h1 { font-size: 28px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }

p { margin: 0 0 var(--gap-sm) 0; color: var(--text-soft); }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

.screen {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
}
.container { padding: var(--gap-md); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: var(--gap-sm);
  width: 100%; padding: 15px var(--gap-md);
  border-radius: var(--radius-md); border: none;
  font-weight: 700; font-size: 16px; cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn-outline:hover { border-color: var(--primary); }
.btn-ghost { background: transparent; color: var(--text-soft); padding: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.pill-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 20px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--text);
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.pill-btn.filled { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pill-btn.surface { background: var(--surface); border-color: var(--line); }

.field { margin-bottom: var(--gap-md); }
.field label { display: block; font-size: 14px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.field input, .field select {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color 0.15s ease;
}
.field input::placeholder { color: var(--text-soft); opacity: 0.7; }
.field input:focus, .field select:focus { border-color: var(--primary); }

.hint { font-size: 13px; color: var(--text-soft); opacity: 0.9; margin-top: 4px; }
.error-text { font-size: 13px; color: var(--danger); margin-top: 4px; display: none; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; }
.badge-success { background: rgba(212,175,55,0.14); color: var(--primary); }
.badge-warn { background: rgba(224,166,58,0.16); color: var(--accent); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--gap-md); background: var(--bg); border-bottom: 1px solid var(--line); color: var(--text);
}
.topbar h1 { color: var(--text); font-size: 20px; margin: 0; }

.divider { display: flex; align-items: center; gap: var(--gap-sm); color: var(--text-soft); font-size: 13px; margin: var(--gap-md) 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.bio-option {
  display: flex; align-items: center; gap: var(--gap-sm);
  padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius-md);
  margin-bottom: var(--gap-sm); cursor: pointer; background: var(--surface);
  transition: border-color 0.15s ease, background 0.15s ease;
}
.bio-option.selected { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .icon {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.bio-option .icon svg { width: 22px; height: 22px; stroke: var(--text); }
.bio-option .texts { flex: 1; }
.bio-option .texts strong { display: block; font-size: 15px; color: var(--text); }
.bio-option .texts span { font-size: 13px; color: var(--text-soft); }
.bio-option.linked { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.bio-option.linked .check { background: var(--primary); border-color: var(--primary); }
.bio-option .check svg { width: 13px; height: 13px; stroke: var(--on-primary); display: none; }
.bio-option.linked .check svg { display: block; }

.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: var(--surface-2); color: var(--text); padding: 12px 22px;
  border-radius: var(--radius-md); font-size: 14px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease, bottom 0.25s ease;
  z-index: 200; max-width: 90%; text-align: center; border: 1px solid var(--line);
}
.toast.show { opacity: 1; bottom: 100px; }
.toast.error { background: var(--danger); color: #fff; border-color: transparent; }
.toast.success { background: var(--primary); color: var(--on-primary); border-color: transparent; }

.spinner {
  width: 20px; height: 20px; border: 2.5px solid rgba(212,175,55,0.25);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- الهيدر الزخرفي: شعار الرياضي المتحرك ---------------- */

.athlete-hero {
  position: relative;
  height: 176px;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 50% 0%, rgba(212,175,55,0.16) 0%, transparent 60%),
    linear-gradient(180deg, #14120E 0%, #0C0B0A 100%);
  border-radius: 0 0 28px 28px;
  border-bottom: 1px solid var(--line);
}
.athlete-hero .hero-content {
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 2px;
}
.athlete-hero .hero-content h1 { color: var(--primary); margin-bottom: 0; letter-spacing: 0.5px; }
.athlete-hero .hero-content p { margin: 0; font-size: 13px; color: var(--text-soft); }

.athlete-hero .glow-line {
  position: absolute; bottom: 34%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.55), transparent);
  animation: glow-run 1.6s linear infinite;
  z-index: 1;
}
.athlete-hero .glow-line.g1 { left: 0; width: 40%; animation-delay: 0s; }
.athlete-hero .glow-line.g2 { left: 0; width: 25%; top: 58%; animation-delay: 0.5s; }
@keyframes glow-run {
  0% { transform: translateX(-40%); opacity: 0; }
  20% { opacity: 0.9; }
  80% { opacity: 0.9; }
  100% { transform: translateX(320%); opacity: 0; }
}

.athlete-figure { width: 86px; height: 100px; z-index: 2; position: relative; }

@media (prefers-reduced-motion: reduce) {
  .athlete-hero .glow-line { animation: none !important; display: none; }
}

.bottom-nav {
  position: fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto;
  background: var(--surface); border-top: 1px solid var(--line);
  display:flex; justify-content:space-around; padding: 10px 0 14px;
}
.bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text-soft); font-weight:600; }
.bottom-nav a.active { color: var(--primary); }
.bottom-nav svg { width:22px; height:22px; }

.stat-cards { display:grid; grid-template-columns: 1fr 1fr; gap: var(--gap-sm); margin-bottom: var(--gap-lg); }
.stat-card { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-md); padding: 14px; text-align:center; }
.stat-card .n { font-family: var(--font-display); font-size:22px; font-weight:800; color: var(--primary); }
.stat-card .l { font-size:12px; color: var(--text-soft); }

.chart-card { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius-lg); padding: var(--gap-md); margin-bottom: var(--gap-lg); }

.note-textarea {
  width:100%; min-height:90px; padding:12px; border:1.5px solid var(--line);
  border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
  resize: vertical; font-family: inherit; font-size:14px; outline:none;
}
.note-textarea:focus { border-color: var(--primary); }
.note-item {
  background: var(--bg); border:1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px 12px; margin-bottom:8px; font-size:13.5px; position:relative;
}
.note-item .note-date { font-size:11px; color: var(--text-soft); margin-bottom:4px; display:block; }
.note-item .note-delete {
  position:absolute; left:8px; top:8px; background:none; border:none; color: var(--text-soft);
  cursor:pointer; font-size:12px;
}
.chart-card h3 { margin-bottom: var(--gap-sm); }
canvas { width:100%; height:180px; display:block; }
</style>
</head>
<body>
<div class="screen">

  <div class="topbar">
    <h1>تقدّمك هذا الأسبوع</h1>
    <span></span>
  </div>

  <div class="container">

    <div class="stat-cards">
      <div class="stat-card"><div class="n" id="stat-workouts">0</div><div class="l">تمارين مكتملة</div></div>
      <div class="stat-card"><div class="n" id="stat-water">0</div><div class="l">متوسط أكواب الماء</div></div>
    </div>

    <div class="chart-card">
      <h3>الوزن (آخر 7 سجلات)</h3>
      <canvas id="chart-weight" width="400" height="180"></canvas>
    </div>

    <div class="chart-card">
      <h3>ساعات النوم (آخر 7 سجلات)</h3>
      <canvas id="chart-sleep" width="400" height="180"></canvas>
    </div>

    <div class="chart-card">
      <h3>ملاحظاتك وتقدّمك</h3>
      <p style="margin-bottom:var(--gap-sm);">دوّن أي ملاحظة عن تقدمك، شعورك بالتمرين، أو هدف تبيه هذا الأسبوع.</p>
      <textarea id="note-input" class="note-textarea" placeholder="اكتب ملاحظتك هنا..."></textarea>
      <button class="btn btn-primary" id="btn-save-note" style="margin-top:var(--gap-sm);">حفظ الملاحظة</button>
      <div id="notes-list" style="margin-top:var(--gap-md);"></div>
    </div>

  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg>الرئيسية</a>
  <a href="workouts.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 10l3-3 3 3-3 3-3-3ZM14 20l3-3 3 3-3 3-3-3Z"/></svg>التمارين</a>
  <a href="health.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 8.6c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10a4.8 4.8 0 0 1 8.8-2.7 4.8 4.8 0 0 1 8.8 2.7Z"/></svg>الصحة</a>
  <a href="progress.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>تقدّمي</a>
  <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>حسابي</a>
</nav>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  const user = Auth.requireAuth();
  const uid = user ? user.id : 'guest';

  function loadHistory(metric) {
    try { return JSON.parse(localStorage.getItem('sehati_metric_' + metric + '_' + uid)) || []; }
    catch(e) { return []; }
  }

  /* إحصائيات سريعة */
  let workoutDays = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = 'sehati_workout_' + uid + '_' + d.toISOString().slice(0,10);
    try {
      const arr = JSON.parse(localStorage.getItem(key));
      if (arr && arr.length) workoutDays++;
    } catch(e) {}
  }
  document.getElementById('stat-workouts').textContent = workoutDays;

  const waterHist = loadHistory('water');
  const avgWater = waterHist.length
    ? (waterHist.slice(-7).reduce((s,i) => s + i.value, 0) / Math.min(7, waterHist.length)).toFixed(1)
    : 0;
  document.getElementById('stat-water').textContent = avgWater;

  /* رسم بياني بسيط بالأعمدة عبر Canvas — بدون أي مكتبات خارجية */
  function drawBarChart(canvasId, data, color) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (!data.length) {
      ctx.fillStyle = '#A8987C';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('لا توجد بيانات كافية بعد', w/2, h/2);
      return;
    }

    const values = data.map(d => d.value);
    const max = Math.max(...values) * 1.15 || 1;
    const barW = w / data.length * 0.55;
    const gap = w / data.length;

    data.forEach((d, i) => {
      const barH = (d.value / max) * (h - 30);
      const x = i * gap + (gap - barW) / 2;
      const y = h - barH - 20;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, barW, barH, 6);
      ctx.fill();

      ctx.fillStyle = '#F3ECDD';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.value, x + barW/2, y - 6);

      ctx.fillStyle = '#A8987C';
      ctx.fillText(d.date.slice(5), x + barW/2, h - 4);
    });
  }

  drawBarChart('chart-weight', loadHistory('weight').slice(-7), '#D4AF37');
  drawBarChart('chart-sleep', loadHistory('sleep').slice(-7), '#E4574C');

  /* ملاحظات وتقدّم المستخدم النصية */
  const NOTES_KEY = 'sehati_notes_' + uid;
  function loadNotes() { try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || []; } catch(e) { return []; } }
  function saveNotes(list) { localStorage.setItem(NOTES_KEY, JSON.stringify(list)); }

  function renderNotes() {
    const list = loadNotes();
    const el = document.getElementById('notes-list');
    if (!list.length) { el.innerHTML = '<p style="margin:0;">ما فيه ملاحظات محفوظة بعد.</p>'; return; }
    el.innerHTML = list.slice().reverse().map((n, revIdx) => {
      const idx = list.length - 1 - revIdx;
      const d = new Date(n.at);
      const dateStr = d.toLocaleDateString('ar', { day: 'numeric', month: 'short' });
      return `<div class="note-item" data-idx="${idx}">
        <button class="note-delete" data-idx="${idx}">✕</button>
        <span class="note-date">${dateStr}</span>
        ${n.text}
      </div>`;
    }).join('');
  }

  document.getElementById('btn-save-note').addEventListener('click', () => {
    const input = document.getElementById('note-input');
    const text = input.value.trim();
    if (!text) { App.appToast('اكتب ملاحظة قبل الحفظ', 'error'); return; }
    const list = loadNotes();
    list.push({ text, at: new Date().toISOString() });
    saveNotes(list);
    input.value = '';
    App.appToast('تم حفظ الملاحظة', 'success');
    renderNotes();
  });

  document.getElementById('notes-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.note-delete');
    if (!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    const list = loadNotes();
    list.splice(idx, 1);
    saveNotes(list);
    renderNotes();
  });

  renderNotes();
</script>
</body>
</html>
