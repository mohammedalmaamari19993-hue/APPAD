<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الدخول — صحّتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4AF37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="صحّتي">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   صحّتي — نظام التصميم الأساسي (ثيم أسود ذهبي فاخر)
   ========================================================================== */

:root {
  --bg: #0C0B0A;
  --surface: #1B1815;
  --surface-2: #262019;

  --text: #F3ECDD;
  --text-soft: #A8987C;

  --primary: #D4AF37;
  --primary-dark: #B8952C;
  --on-primary: #14120E;

  --accent: #E0A63A;
  --danger: #E4574C;
  --line: #2E2820;

  --shadow: 0 14px 34px rgba(0, 0, 0, 0.55);

  --gap-xs: 6px;
  --gap-sm: 12px;
  --gap-md: 20px;
  --gap-lg: 32px;
  --gap-xl: 48px;

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;

  --font-display: 'Cairo', sans-serif;
  --font-body: 'IBM Plex Sans Arabic', sans-serif;
}

* { box-sizing: border-box; }
html { direction: rtl; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 76px;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--text);
  margin: 0 0 var(--gap-sm) 0;
  line-height: 1.3;
}
h1 { font-size: 28px; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }

p { margin: 0 0 var(--gap-sm) 0; color: var(--text-soft); }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

.screen {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
}
.container { padding: var(--gap-md); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: var(--gap-sm);
  width: 100%; padding: 15px var(--gap-md);
  border-radius: var(--radius-md); border: none;
  font-weight: 700; font-size: 16px; cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn-outline:hover { border-color: var(--primary); }
.btn-ghost { background: transparent; color: var(--text-soft); padding: 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.pill-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 10px 20px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: 14px; cursor: pointer;
  border: 1.5px solid var(--line); background: transparent; color: var(--text);
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.pill-btn.filled { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pill-btn.surface { background: var(--surface); border-color: var(--line); }

.field { margin-bottom: var(--gap-md); }
.field label { display: block; font-size: 14px; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.field input, .field select {
  width: 100%; padding: 13px 14px;
  border: 1.5px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color 0.15s ease;
}
.field input::placeholder { color: var(--text-soft); opacity: 0.7; }
.field input:focus, .field select:focus { border-color: var(--primary); }

.hint { font-size: 13px; color: var(--text-soft); opacity: 0.9; margin-top: 4px; }
.error-text { font-size: 13px; color: var(--danger); margin-top: 4px; display: none; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; }
.badge-success { background: rgba(212,175,55,0.14); color: var(--primary); }
.badge-warn { background: rgba(224,166,58,0.16); color: var(--accent); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--gap-md); background: var(--bg); border-bottom: 1px solid var(--line); color: var(--text);
}
.topbar h1 { color: var(--text); font-size: 20px; margin: 0; }

.divider { display: flex; align-items: center; gap: var(--gap-sm); color: var(--text-soft); font-size: 13px; margin: var(--gap-md) 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.bio-option {
  display: flex; align-items: center; gap: var(--gap-sm);
  padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius-md);
  margin-bottom: var(--gap-sm); cursor: pointer; background: var(--surface);
  transition: border-color 0.15s ease, background 0.15s ease;
}
.bio-option.selected { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .icon {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.bio-option .icon svg { width: 22px; height: 22px; stroke: var(--text); }
.bio-option .texts { flex: 1; }
.bio-option .texts strong { display: block; font-size: 15px; color: var(--text); }
.bio-option .texts span { font-size: 13px; color: var(--text-soft); }
.bio-option.linked { border-color: var(--primary); background: rgba(212,175,55,0.08); }
.bio-option .check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.bio-option.linked .check { background: var(--primary); border-color: var(--primary); }
.bio-option .check svg { width: 13px; height: 13px; stroke: var(--on-primary); display: none; }
.bio-option.linked .check svg { display: block; }

.toast {
  position: fixed; bottom: 90px; right: 50%; transform: translateX(50%);
  background: var(--surface-2); color: var(--text); padding: 12px 22px;
  border-radius: var(--radius-md); font-size: 14px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity 0.25s ease, bottom 0.25s ease;
  z-index: 200; max-width: 90%; text-align: center; border: 1px solid var(--line);
}
.toast.show { opacity: 1; bottom: 100px; }
.toast.error { background: var(--danger); color: #fff; border-color: transparent; }
.toast.success { background: var(--primary); color: var(--on-primary); border-color: transparent; }

.spinner {
  width: 20px; height: 20px; border: 2.5px solid rgba(212,175,55,0.25);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- الهيدر الزخرفي: شعار الرياضي المتحرك ---------------- */

.athlete-hero {
  position: relative;
  height: 176px;
  overflow: hidden;
  background:
    radial-gradient(120% 100% at 50% 0%, rgba(212,175,55,0.16) 0%, transparent 60%),
    linear-gradient(180deg, #14120E 0%, #0C0B0A 100%);
  border-radius: 0 0 28px 28px;
  border-bottom: 1px solid var(--line);
}
.athlete-hero .hero-content {
  position: relative;
  z-index: 3;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 2px;
}
.athlete-hero .hero-content h1 { color: var(--primary); margin-bottom: 0; letter-spacing: 0.5px; }
.athlete-hero .hero-content p { margin: 0; font-size: 13px; color: var(--text-soft); }

.athlete-hero .glow-line {
  position: absolute; bottom: 34%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.55), transparent);
  animation: glow-run 1.6s linear infinite;
  z-index: 1;
}
.athlete-hero .glow-line.g1 { left: 0; width: 40%; animation-delay: 0s; }
.athlete-hero .glow-line.g2 { left: 0; width: 25%; top: 58%; animation-delay: 0.5s; }
@keyframes glow-run {
  0% { transform: translateX(-40%); opacity: 0; }
  20% { opacity: 0.9; }
  80% { opacity: 0.9; }
  100% { transform: translateX(320%); opacity: 0; }
}

.athlete-figure { width: 86px; height: 100px; z-index: 2; position: relative; }

@media (prefers-reduced-motion: reduce) {
  .athlete-hero .glow-line { animation: none !important; display: none; }
}

.bottom-nav {
  position: fixed; bottom:0; right:0; left:0; max-width:480px; margin:0 auto;
  background: var(--surface); border-top: 1px solid var(--line);
  display:flex; justify-content:space-around; padding: 10px 0 14px;
}
.bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--text-soft); font-weight:600; }
.bottom-nav a.active { color: var(--primary); }
.bottom-nav svg { width:22px; height:22px; }

.bio-quick { display: flex; flex-direction: column; align-items: center; gap: var(--gap-sm); padding: var(--gap-lg) 0; }
.bio-quick .icon { width: 84px; height: 84px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.bio-quick .icon svg { width: 38px; height: 38px; stroke: var(--text); }

.mismatch-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(12,11,10,0.92);
  display: none; align-items: center; justify-content: center;
  padding: var(--gap-md);
}
.mismatch-overlay.show { display: flex; }
.mismatch-card {
  width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: var(--gap-lg) var(--gap-md); text-align: center;
}
.mismatch-card .icon-x {
  width: 60px; height: 60px; border-radius: 50%; background: rgba(228,87,76,0.12);
  display: flex; align-items: center; justify-content: center; margin: 0 auto var(--gap-md);
}
.mismatch-card .icon-x svg { width: 28px; height: 28px; stroke: var(--danger); }
.mismatch-card h3 { margin-bottom: 6px; }
.mismatch-card p { font-size: 13.5px; margin-bottom: var(--gap-lg); }
.mismatch-card .btn { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="screen">

  <div class="mismatch-overlay" id="mismatch-overlay">
    <div class="mismatch-card">
      <div class="icon-x"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
      <h3 id="mismatch-title">الرقم والبصمة غير متطابقين</h3>
      <p id="mismatch-msg">تأكد إن رقم التواصل صحيح، وإن هذي البصمة مربوطة بنفس الحساب.</p>
      <button class="btn btn-primary" id="mismatch-retry">حاول مرة أخرى</button>
      <button class="btn btn-outline" id="mismatch-password">الدخول بكلمة السر بدلًا من ذلك</button>
    </div>
  </div>


  <div class="athlete-hero">
    <div class="glow-line g1"></div>
    <div class="glow-line g2"></div>
    <div class="hero-content">
      <svg class="athlete-figure" viewBox="0 0 120 140" fill="none">
      <circle cx="60" cy="20" r="10" fill="#D4AF37"/>
      <line x1="60" y1="30" x2="60" y2="76" stroke="#D4AF37" stroke-width="8" stroke-linecap="round"/>
      <line x1="60" y1="40" x2="34" y2="60" stroke="#D4AF37" stroke-width="7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-35 60 40;35 60 40;-35 60 40" dur="0.6s" repeatCount="indefinite"/></line>
      <line x1="60" y1="40" x2="86" y2="60" stroke="#D4AF37" stroke-width="7" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="35 60 40;-35 60 40;35 60 40" dur="0.6s" repeatCount="indefinite"/></line>
      <line x1="60" y1="76" x2="34" y2="126" stroke="#D4AF37" stroke-width="9" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="30 60 76;-30 60 76;30 60 76" dur="0.6s" repeatCount="indefinite"/></line>
      <line x1="60" y1="76" x2="86" y2="126" stroke="#D4AF37" stroke-width="9" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="-30 60 76;30 60 76;-30 60 76" dur="0.6s" repeatCount="indefinite"/></line>
    </svg>
      <h1>صحّتي</h1>
      <p>لياقتك، تغذيتك، وعاداتك الصحية — بمكان واحد</p>
    </div>
  </div>

  <div class="container">

    <div class="field">
      <label for="phone">رقم التواصل</label>
      <input id="phone" type="tel" placeholder="05xxxxxxxx" autocomplete="tel">
    </div>
    <div class="field">
      <label for="password">كلمة السر (اختياري لو راح تدخل بالبصمة)</label>
      <input id="password" type="password" placeholder="كلمة السر" autocomplete="current-password">
      <div class="error-text" id="login-error"></div>
    </div>

    <button class="btn btn-primary" id="btn-login">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      الدخول بكلمة السر
    </button>

    <div class="divider">أو ادخل مباشرة بالبصمة</div>

    <button class="btn btn-outline" id="btn-face">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10h.01M15 10h.01M8 15c1 1.2 2.4 2 4 2s3-.8 4-2"/><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/></svg>
      الدخول ببصمة الوجه
    </button>
    <button class="btn btn-outline" id="btn-hand" style="margin-top:10px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4M12 10V4.5a1.5 1.5 0 0 1 3 0V10M15 10V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7s-5.5-2-6.5-4L4 13a1.4 1.4 0 0 1 2.3-1.6L8 13.5"/></svg>
      الدخول ببصمة اليد
    </button>
    <div class="error-text" id="bio-error" style="text-align:center; margin-top:10px;"></div>

    <button class="btn btn-outline" id="btn-signup" style="margin-top:var(--gap-lg);">ليس لديك حساب؟ أنشئ حساب جديد</button>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.athlete-figure').forEach(svg => { if (svg.pauseAnimations) svg.pauseAnimations(); });
  }
</script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  const toast = document.getElementById('toast');
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  if (Auth.getSession()) window.location.href = 'index.html';

  document.getElementById('btn-signup').addEventListener('click', () => window.location.href = 'signup.html');

  document.getElementById('btn-login').addEventListener('click', async () => {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    try {
      await Auth.loginWithPassword(phone, password);
      window.location.href = 'index.html';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  });

  async function loginWithBio(type) {
    const phone = document.getElementById('phone').value.trim();
    const errEl = document.getElementById('bio-error');
    errEl.style.display = 'none';

    if (!phone) { errEl.textContent = 'أدخل رقم التواصل أولًا'; errEl.style.display = 'block'; return; }
    const user = Auth.findUserByPhone(phone);
    if (!user) { showMismatch('لا يوجد حساب بهذا الرقم', 'تأكد إنك كاتب رقم التواصل الصحيح، أو أنشئ حساب جديد.'); return; }

    try {
      await Auth.verifyBiometric(user.id, type);
      showToast('تم التحقق بنجاح', 'success');
      setTimeout(() => window.location.href = 'index.html', 700);
    } catch (err) {
      showMismatch('الرقم والبصمة غير متطابقين', err.message);
    }
  }

  const mismatchOverlay = document.getElementById('mismatch-overlay');
  function showMismatch(title, msg) {
    document.getElementById('mismatch-title').textContent = title;
    document.getElementById('mismatch-msg').textContent = msg;
    mismatchOverlay.classList.add('show');
  }
  document.getElementById('mismatch-retry').addEventListener('click', () => {
    mismatchOverlay.classList.remove('show');
  });
  document.getElementById('mismatch-password').addEventListener('click', () => {
    mismatchOverlay.classList.remove('show');
    document.getElementById('password').focus();
  });

  document.getElementById('btn-face').addEventListener('click', () => loginWithBio('face'));
  document.getElementById('btn-hand').addEventListener('click', () => loginWithBio('hand'));
</script>
</body>
</html>
